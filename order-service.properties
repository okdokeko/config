# trimming down the file
server.port=8087
spring.jpa.database=POSTGRESQL
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
management.endpoints.web.exposure.include=*

# eureka config
eureka.instance.preferIpAddress=true
eureka.client.serviceUrl.defaultZone=http://eurekaserver:8070/eureka/

# keycloak config
keycloak.realm=samazon-realm
keycloak.auth-server-url=http://keycloak:8080/auth
keycloak.ssl-required=external
keycloak.resource=samazon-client
keycloak.use-resource-role-mappings=true
keycloak.bearer-only=true

# resiliency config
resilience4j.circuitbreaker.instances.productService.slidingWindowSize=5
resilience4j.circuitbreaker.instances.productService.minimumNumberOfCalls=3
resilience4j.circuitbreaker.instances.productService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.productService.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.productService.ignoreExceptions=org.springframework.web.server.ResponseStatusException