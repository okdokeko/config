server:
  port: 8072

eureka:
  instance:
    preferIpAddress: true
  client:
    registerWithEureka: true
    fetchRegistry: true
    registryFetchIntervalSeconds: 5
    serviceUrl:
      defaultZone: http://eurekaserver:8070/eureka/

ribbon:
  ServerListRefreshInterval: 5000
      
spring:
  cloud:
    gateway:
      httpclient:
        connect-timeout: 1000
      default-filters:
        - name: Retry
          args:
            retries: 3
      routes:
        - id: product-service
          uri: lb://product-service
          predicates:
            - Path=/samazon/products/**
        - id: order-service
          uri: lb://order-service
          predicates:
            - Path=/samazon/orders/**

management:
  endpoints:
    web:
      exposure:
        include: "*"
