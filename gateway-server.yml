server:
  port: 8072

eureka:
  instance:
    preferIpAddress: true
  client:
    registerWithEureka: true
    fetchRegistry: true
    serviceUrl:
      defaultZone: http://eurekaserver:8070/eureka/
      
spring:
  cloud:
    gateway:
      routes:
        - id: product-service
          uri: lb://product-service
          predicates:
            - Path=/samazon/products/**
        - id: order-service
          uri: lb://order-service
          predicates:
            - Path=/samazon/orders/**

management:
  endpoints:
    web:
      exposure:
        include: "*"
